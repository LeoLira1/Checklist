name: Build & Release APK

# Gera o APK sem PC: abra a aba Actions do repositório no celular, escolha
# "Build & Release APK" → Run workflow. O APK sai na página Releases.
on:
  push:
    branches:
      - main
      - "ccr-6d500a04-jega9y"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android project structure
        # Gera o projeto Android padrão do Flutter num diretório temporário e
        # copia só a pasta android/ (mesma abordagem do Gondolas): nenhum
        # binário (gradle-wrapper.jar) entra no repositório.
        run: |
          flutter create \
            --org com.camda \
            --project-name checklist_camda \
            /tmp/scaffold

          MANIFEST=/tmp/scaffold/android/app/src/main/AndroidManifest.xml

          sed -i \
            's/android:label="checklist_camda"/android:label="Risca"/' \
            "$MANIFEST"

          # Sem INTERNET o DNS falha em release.
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' \
              "$MANIFEST"

          cp -r /tmp/scaffold/android .

      - name: Restore signing key (optional)
        # Com o secret DEBUG_KEYSTORE_BASE64 cadastrado, todo build sai com a
        # MESMA assinatura e o APK novo atualiza o antigo por cima. Sem o
        # secret o build funciona igual, mas a assinatura muda a cada build
        # ("App não foi instalado" ao atualizar: desinstale e instale de novo).
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Assinatura fixa restaurada."
          else
            echo "Sem DEBUG_KEYSTORE_BASE64: assinatura nova neste build."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify SQL
        run: python3 tool/verify_sql.py

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: risca-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Risca #${{ github.run_number }}"
          body: |
            ## Risca — checklist de tarefas urgentes da CAMDA

            **Primeiro uso:** toque em ⚙️ e informe URL + Token do Turso (os mesmos do CAMDA Estoque).

            **Build:** #${{ github.run_number }} | Branch: `${{ github.ref_name }}`
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
